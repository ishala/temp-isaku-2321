<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentiment i.saku</title>
  <meta name="robots" content="noindex" />
  <!-- Fallback jika JavaScript dimatikan -->
  <noscript><meta http-equiv="refresh" content="0; url=login.html" /></noscript>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1rem;
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a; color: #e2e8f0;
    }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .label { font-size: 0.9rem; color: #94a3b8; letter-spacing: 0.02em; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    /* Redirect di <head> supaya jalan sebelum halaman ter-render (tanpa flash). */
    (function () {
      var token = localStorage.getItem('token');
      window.location.replace(token ? 'dashboard.html' : 'login.html');
    })();
  </script>
</head>
<body>
  <div class="spinner" role="status" aria-label="Memuat"></div>
  <div class="label">Mengalihkan…</div>
</body>
</html>
